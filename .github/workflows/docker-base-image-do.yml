name: Build and Push n8n Base Image to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to build this image with.'
        type: choice
        required: true
        default: '22'
        options:
          - '18'
          - '20'
          - '22'
  push:
    branches: [ replikate ]
    paths:
      - 'docker/images/n8n-base/**'

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set Node version
        id: set-node-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.node_version }}" ]; then
            echo "NODE_VERSION=${{ github.event.inputs.node_version }}" >> $GITHUB_ENV
          else
            echo "NODE_VERSION=22" >> $GITHUB_ENV
          fi

      - name: Build and push base image
        uses: docker/build-push-action@v6.11.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./docker/images/n8n-base/Dockerfile
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            registry.digitalocean.com/replikate-sg/n8n-base:${{ env.NODE_VERSION }}
